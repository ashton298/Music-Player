# Builds the Windows installer and the Mac app on GitHub's machines.
# Run it from the repo's Actions tab ("Run workflow") or push a tag like v0.2.0.
# The finished files appear under the run's "Artifacts".
name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            files: dist/*.exe
          - os: macos-latest
            target: --mac
            files: dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # no paid signing certificate
      - uses: actions/upload-artifact@v4
        with:
          name: playlist-merger-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
